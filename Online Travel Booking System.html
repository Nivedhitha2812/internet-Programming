<!DOCTYPE html>
<html>
<head>
    <title>Travel Booking</title>
</head>
<body>

<h1 align="center">Wanderlust Travels</h1>

<h2>Search Destination</h2>

<form>
    Destination: <input type="text"><br><br>
    Travel Date: <input type="date"><br><br>
    <input type="submit" value="Search">
</form>

<h2>Travel Details</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Place</th>
    <th>Hotel</th>
    <th>Route</th>
    <th>Action</th>
</tr>
<tr>
    <td>Kodaikanal</td>
    <td>Hill View Hotel</td>
    <td>Chennai - Kodaikanal</td>
    <td><button>Book</button></td>
</tr>
<tr>
    <td>Ooty</td>
    <td>Green Hotel</td>
    <td>Coimbatore - Ooty</td>
    <td><button>Book</button></td>
</tr>
</table>

<h2>Accommodation Booking</h2>

<form>
    Name: <input type="text"><br><br>
    Hotel: <input type="text"><br><br>
    Check-in: <input type="date"><br><br>
    <input type="submit" value="Book">
</form>

</body>
</html>
