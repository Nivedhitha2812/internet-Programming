<!DOCTYPE html>
<html>
<head>
    <title>Home Finder</title>
</head>
<body>

<h1 align="center">Home Finder</h1>

<h2>Search Property</h2>

<form>
    Location:
    <input type="text"><br><br>

    Property Type:
    <select>
        <option>House</option>
        <option>Land</option>
        <option>Apartment</option>
    </select><br><br>

    Budget:
    <input type="number"><br><br>

    <input type="submit" value="Search">
</form>

<h2>Available Properties</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Property</th>
    <th>Location</th>
    <th>Price</th>
</tr>
<tr>
    <td>2BHK House</td>
    <td>Chennai</td>
    <td>₹45 Lakhs</td>
</tr>
<tr>
    <td>Residential Land</td>
    <td>Madurai</td>
    <td>₹20 Lakhs</td>
</tr>
</table>

</body>
</html>
