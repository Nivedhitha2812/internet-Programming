<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment</title>
</head>
<body>

<h1 align="center">Hospital Appointment System</h1>

<h2>Find Doctor</h2>

<form>
    Location: <input type="text"><br><br>

    Specialization:
    <select>
        <option>Cardiologist</option>
        <option>Dermatologist</option>
        <option>General Physician</option>
    </select><br><br>

    <input type="submit" value="Search">
</form>

<h2>Doctors</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Doctor</th>
    <th>Specialization</th>
    <th>Available</th>
</tr>
<tr>
    <td>Dr. Kumar</td>
    <td>Cardiologist</td>
    <td>10 AM - 1 PM</td>
</tr>
<tr>
    <td>Dr. Priya</td>
    <td>Dermatologist</td>
    <td>2 PM - 5 PM</td>
</tr>
</table>

<h2>Book Appointment</h2>

<form>
    Patient Name: <input type="text"><br><br>
    Date: <input type="date"><br><br>
    Time: <input type="time"><br><br>
    <input type="submit" value="Book">
</form>

</body>
</html>
