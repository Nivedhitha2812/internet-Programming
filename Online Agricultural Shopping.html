<!DOCTYPE html>
<html>
<head>
    <title>AgriMart</title>
</head>
<body>

<h1 align="center">AgriMart</h1>

<h2>Farm Products</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Product</th>
    <th>Category</th>
    <th>Price</th>
</tr>
<tr>
    <td>Rice Seeds</td>
    <td>Seeds</td>
    <td>₹500</td>
</tr>
<tr>
    <td>Organic Fertilizer</td>
    <td>Fertilizer</td>
    <td>₹800</td>
</tr>
<tr>
    <td>Sprayer</td>
    <td>Equipment</td>
    <td>₹1500</td>
</tr>
</table>

<h2>Order Product</h2>

<form>
    Farmer Name: <input type="text"><br><br>

    Product:
    <select>
        <option>Rice Seeds</option>
        <option>Organic Fertilizer</option>
        <option>Sprayer</option>
    </select><br><br>

    Quantity: <input type="number"><br><br>

    <input type="submit" value="Order">
</form>

</body>
</html>
