<!DOCTYPE html>
<html>
<head>
    <title>Bus Pass</title>
</head>
<body>

<h1 align="center">Online Bus Pass System</h1>

<h2>Apply for Bus Pass</h2>

<form>
    Name: <input type="text"><br><br>
    Date of Birth: <input type="date"><br><br>
    Email: <input type="email"><br><br>
    School / Organization: <input type="text"><br><br>

    Pass Type:
    <select>
        <option>Student Pass</option>
        <option>Route Pass</option>
    </select><br><br>

    Validity:
    <select>
        <option>1 Month</option>
        <option>3 Months</option>
        <option>6 Months</option>
    </select><br><br>

    <input type="submit" value="Apply">
</form>

<h2>Route Details</h2>

<table border="1" cellpadding="10">
<tr>
    <th>From</th>
    <th>To</th>
    <th>Time</th>
</tr>
<tr>
    <td>Chennai</td>
    <td>Tambaram</td>
    <td>8:00 AM</td>
</tr>
</table>

</body>
</html>
