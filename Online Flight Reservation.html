<!DOCTYPE html>
<html>
<head>
    <title>Flight Reservation</title>
</head>
<body>

<h1 align="center">Online Flight Reservation System</h1>

<h2>Search Flight</h2>

<form>
    From:
    <input type="text"><br><br>

    To:
    <input type="text"><br><br>

    Date:
    <input type="date"><br><br>

    Class:
    <select>
        <option>Economy</option>
        <option>Business</option>
        <option>First Class</option>
    </select>
    <br><br>

    <input type="submit" value="Search Flight">
</form>

<h2>Available Flights</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Airline</th>
    <th>Departure</th>
    <th>Arrival</th>
    <th>Price</th>
</tr>

<tr>
    <td>Air India</td>
    <td>8:00 AM</td>
    <td>11:00 AM</td>
    <td>₹5,500</td>
</tr>

<tr>
    <td>IndiGo</td>
    <td>2:00 PM</td>
    <td>5:00 PM</td>
    <td>₹4,800</td>
</tr>
</table>

<h2>Passenger Details</h2>

<form>
    Name:
    <input type="text"><br><br>

    Email:
    <input type="email"><br><br>

    Seat:
    <input type="text"><br><br>

    <input type="submit" value="Book Ticket">
</form>

</body>
</html>
