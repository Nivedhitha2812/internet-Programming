<!DOCTYPE html>
<html>
<head>
    <title>Veterinary System</title>
</head>
<body>

<h1 align="center">VetCure</h1>

<h2>Farmer Login</h2>

<form>
    Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>

    <input type="submit" value="Login">
</form>

<h2>Animal Problem</h2>

<form>
    Animal Name: <input type="text"><br><br>

    Symptoms:
    <textarea placeholder="Enter symptoms"></textarea><br><br>

    Upload Image:
    <input type="file"><br><br>

    <input type="submit" value="Send to Doctor">
</form>

<h2>Doctor</h2>

<form>
    Doctor Name: <input type="text"><br><br>
    Solution:
    <textarea></textarea><br><br>

    <input type="submit" value="Send Solution">
</form>

</body>
</html>
