<!DOCTYPE html>
<html>
<head>
    <title>Electronic Shop</title>
</head>
<body>

<h1 align="center">TechSavvy Electronic Shop</h1>

<h2>Search Product</h2>

<input type="text" placeholder="Search product">
<button>Search</button>

<h2>Products</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Product</th>
    <th>Price</th>
    <th>Availability</th>
</tr>
<tr>
    <td>Laptop</td>
    <td>₹50,000</td>
    <td>Available</td>
</tr>
<tr>
    <td>Smartphone</td>
    <td>₹25,000</td>
    <td>Available</td>
</tr>
<tr>
    <td>Tablet</td>
    <td>₹18,000</td>
    <td>Available</td>
</tr>
</table>

<h2>Shopping Cart</h2>

<form>
    Product:
    <select>
        <option>Laptop</option>
        <option>Smartphone</option>
        <option>Tablet</option>
    </select><br><br>

    Quantity: <input type="number"><br><br>

    <input type="submit" value="Add to Cart">
</form>

</body>
</html>
