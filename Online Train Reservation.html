<!DOCTYPE html>
<html>
<head>
    <title>Train Reservation</title>
</head>
<body>

<h1 align="center">Online Train Reservation System</h1>

<h2>Search Train</h2>

<form>
    From:
    <input type="text"><br><br>

    To:
    <input type="text"><br><br>

    Journey Date:
    <input type="date"><br><br>

    Class:
    <select>
        <option>Sleeper</option>
        <option>3 AC</option>
        <option>2 AC</option>
        <option>1 AC</option>
    </select>
    <br><br>

    <input type="submit" value="Search">
</form>

<h2>Available Trains</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Train Name</th>
    <th>Departure</th>
    <th>Arrival</th>
    <th>Seats</th>
</tr>

<tr>
    <td>Chennai Express</td>
    <td>6:00 AM</td>
    <td>2:00 PM</td>
    <td>50</td>
</tr>

<tr>
    <td>Southern Express</td>
    <td>8:00 PM</td>
    <td>6:00 AM</td>
    <td>30</td>
</tr>
</table>

<h2>Passenger Details</h2>

<form>
    Name: <input type="text"><br><br>
    Age: <input type="number"><br><br>
    ID Number: <input type="text"><br><br>

    <input type="submit" value="Reserve Ticket">
</form>

</body>
</html>
