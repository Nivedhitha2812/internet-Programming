<!DOCTYPE html>
<html>
<head>
    <title>Second Hand Marketplace</title>
</head>
<body>

<h1 align="center">ReNewMarket</h1>

<h2>Search Products</h2>

<input type="text" placeholder="Search item">
<button>Search</button>

<h2>Products</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Item</th>
    <th>Category</th>
    <th>Price</th>
    <th>Condition</th>
</tr>
<tr>
    <td>Laptop</td>
    <td>Electronics</td>
    <td>₹25,000</td>
    <td>Good</td>
</tr>
<tr>
    <td>Sofa</td>
    <td>Furniture</td>
    <td>₹8,000</td>
    <td>Used</td>
</tr>
<tr>
    <td>Bicycle</td>
    <td>Sports</td>
    <td>₹5,000</td>
    <td>Good</td>
</tr>
</table>

<h2>Seller Details</h2>

<form>
    Name: <input type="text"><br><br>
    Item Name: <input type="text"><br><br>
    Price: <input type="number"><br><br>
    <input type="submit" value="Post Item">
</form>

</body>
</html>
