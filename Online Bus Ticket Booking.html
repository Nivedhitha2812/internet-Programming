<!DOCTYPE html>
<html>
<head>
    <title>Bus Ticket Booking</title>
</head>
<body>

<h1 align="center">Online Bus Ticket Booking</h1>

<h2>Search Bus</h2>

<form>
    From:
    <input type="text"><br><br>

    To:
    <input type="text"><br><br>

    Date:
    <input type="date"><br><br>

    <input type="submit" value="Search Bus">
</form>

<h2>Available Buses</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Bus</th>
    <th>Time</th>
    <th>Type</th>
    <th>Seats</th>
</tr>

<tr>
    <td>Express 101</td>
    <td>9:00 AM</td>
    <td>AC</td>
    <td>20</td>
</tr>

<tr>
    <td>Super Fast</td>
    <td>10:30 PM</td>
    <td>Sleeper</td>
    <td>15</td>
</tr>
</table>

<h2>Passenger Details</h2>

<form>
    Name:
    <input type="text"><br><br>

    Mobile:
    <input type="tel"><br><br>

    Seat Number:
    <input type="number"><br><br>

    <input type="submit" value="Book Ticket">
</form>

</body>
</html>
