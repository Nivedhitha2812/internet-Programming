<html>
<head>
    <title>Online Store</title>
</head>
<body>

<h1 align="center">My Online Store</h1>

<form>

    <input type="submit" value="Search">
</form>

</tr>

    <td>₹15,000</td>

</tr>
<tr>

    <td>Available</td>
</tr>
</table>

    Quantity: <input type="number"><br><br>
    <input type="submit" value="Add to Cart">
</form>

<form>
    Name: <input type="text"><br><br>
