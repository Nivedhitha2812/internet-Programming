<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Rental</title>
</head>
<body>

<h1 align="center">RentRide</h1>

<h2>Available Vehicles</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Vehicle</th>
    <th>Type</th>
    <th>Price / Day</th>
</tr>
<tr>
    <td>Swift</td>
    <td>Car</td>
    <td>₹1500</td>
</tr>
<tr>
    <td>Innova</td>
    <td>SUV</td>
    <td>₹2500</td>
</tr>
<tr>
    <td>Mini Truck</td>
    <td>Truck</td>
    <td>₹3000</td>
</tr>
</table>

<h2>Book Vehicle</h2>

<form>
    Name: <input type="text"><br><br>
    Phone: <input type="tel"><br><br>

    Vehicle:
    <select>
        <option>Swift</option>
        <option>Innova</option>
        <option>Mini Truck</option>
    </select><br><br>

    Rental Date: <input type="date"><br><br>
    Number of Days: <input type="number"><br><br>

    <input type="submit" value="Book Vehicle">
</form>

</body>
</html>
