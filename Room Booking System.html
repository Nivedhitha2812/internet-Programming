```html
<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking</title>
</head>
<body>

<h1 align="center">Hotel Booking System</h1>

<h2>Room Details</h2>
<table border="1" cellpadding="10">
<tr>
    <th>Room Type</th>
    <th>Price</th>
    <th>Availability</th>
</tr>
<tr>
    <td>Single Room</td>
    <td>₹1500</td>
    <td>Available</td>
</tr>
<tr>
    <td>Double Room</td>
    <td>₹2500</td>
    <td>Available</td>
</tr>
<tr>
    <td>Deluxe Room</td>
    <td>₹4000</td>
    <td>Not Available</td>
</tr>
</table>

<h2>Book Room</h2>
<form>
    Customer Name: <input type="text"><br><br>
    Room Type:
    <select>
        <option>Single Room</option>
        <option>Double Room</option>
        <option>Deluxe Room</option>
    </select><br><br>

    Check-in: <input type="date"><br><br>
    Check-out: <input type="date"><br><br>

    <input type="submit" value="Book Room">
</form>

</body>
</html>
