<!DOCTYPE html>
<html>
<head>
<title>Electricity Bill Payment</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0}
header{background:#3730a3;color:white;padding:25px;text-align:center}
.container{width:500px;max-width:90%;margin:30px auto}
.card{background:white;padding:25px;border-radius:10px;
      box-shadow:0 2px 10px #aaa}
input,select{width:95%;padding:12px;margin:8px 0}
button{width:100%;padding:12px;background:#3730a3;color:white;border:0}
</style>
</head>
<body>

<header>
<h1>⚡ Electricity Bill Payment</h1>
</header>

<div class="container">

<div class="card">
<h2>Customer Registration</h2>
<input type="text" placeholder="Customer Name">
<input type="email" placeholder="Email">
<input type="text" placeholder="EB Connection Number">
<input type="password" placeholder="Password">
<button>Register</button>
</div>

<br>

<div class="card">
<h2>Login</h2>
<input type="text" placeholder="Connection Number">
<input type="password" placeholder="Password">
<button>Login</button>
</div>

<br>

<div class="card">
<h2>Bill Details</h2>
<p><b>Connection Type:</b> Domestic</p>
<p><b>Units Consumed:</b> 350</p>
<p><b>Bill Amount:</b> ₹900</p>
<p><b>Last Date:</b> 30-08-2026</p>
<p><b>Fine:</b> ₹10 per day after due date</p>

<h3>Payment Method</h3>
<select>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>
<option>Digital Wallet</option>
</select>

<button>Pay Bill</button>
</div>

</div>
</body>
</html>
