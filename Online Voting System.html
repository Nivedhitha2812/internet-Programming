<!DOCTYPE html>
<html>
<head>
    <title>Online Voting</title>
</head>
<body>

<h1 align="center">VoteOnline</h1>

<h2>Voter Login</h2>

<form>
    Voter ID: <input type="text"><br><br>
    Password: <input type="password"><br><br>
    OTP: <input type="text"><br><br>

    <input type="submit" value="Login">
</form>

<h2>Choose Candidate</h2>

<form>
    <input type="radio" name="candidate"> Candidate A<br><br>
    <input type="radio" name="candidate"> Candidate B<br><br>
    <input type="radio" name="candidate"> Candidate C<br><br>

    <input type="submit" value="Submit Vote">
</form>

</body>
</html>
