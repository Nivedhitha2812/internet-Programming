<!DOCTYPE html>
<html>
<head>
<title>Placement Examination</title>
<style>
body{font-family:Arial;background:#f0fdf4;margin:0}
header{background:#166534;color:white;text-align:center;padding:25px}
.container{width:80%;margin:30px auto}
.card{background:white;padding:25px;margin:20px 0;
      border-radius:10px;box-shadow:0 2px 8px #aaa}
button{padding:12px 25px;background:#166534;color:white;border:0}
</style>
</head>
<body>

<header>
<h1>Online Placement Examination</h1>
</header>

<div class="container">

<div class="card">
<h2>Candidate Login</h2>
<input type="text" placeholder="Candidate ID"><br><br>
<input type="password" placeholder="Password"><br><br>
<button>Login</button>
</div>

<div class="card">
<h2>Exam Schedule</h2>
<p><b>Exam:</b> Placement Test</p>
<p><b>Date:</b> 30-08-2026</p>
<p><b>Time:</b> 10:00 AM</p>
<button>Start Exam</button>
</div>

<div class="card">
<h2>Question 1</h2>
<p>Which language is used to structure a webpage?</p>
<input type="radio" name="q1"> HTML<br>
<input type="radio" name="q1"> Python<br>
<input type="radio" name="q1"> SQL<br>
<input type="radio" name="q1"> Java
</div>

<div class="card">
<h2>Result</h2>
<p>Candidate: John</p>
<p>Score: 85 / 100</p>
<p>Rank: 12</p>
<p>Status: <b>PASS</b></p>
<button>Download Scorecard</button>
</div>

</div>
</body>
</html>
