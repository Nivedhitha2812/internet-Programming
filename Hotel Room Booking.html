<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking</title>
</head>
<body>

<h1 align="center">Hotel Room Booking System</h1>

<h2>Search Room</h2>

<form>
    Location:
    <input type="text"><br><br>

    Check-in:
    <input type="date"><br><br>

    Check-out:
    <input type="date"><br><br>

    Guests:
    <input type="number"><br><br>

    <input type="submit" value="Search">
</form>

<h2>Available Rooms</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Room Type</th>
    <th>Price</th>
    <th>Availability</th>
</tr>
<tr>
    <td>Single Room</td>
    <td>₹2000</td>
    <td>Available</td>
</tr>
<tr>
    <td>Double Room</td>
    <td>₹3500</td>
    <td>Available</td>
</tr>
<tr>
    <td>Deluxe Room</td>
    <td>₹5000</td>
    <td>Not Available</td>
</tr>
</table>

<h2>Booking</h2>
<button>Book Room</button>

</body>
</html>
