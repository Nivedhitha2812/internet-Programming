<!DOCTYPE html>
<html>
<head>
    <title>Cake Ordering</title>
</head>
<body>

<h1 align="center">Online Cake Ordering System</h1>

<h2>Available Cakes</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Cake</th>
    <th>Flavor</th>
    <th>Price</th>
</tr>
<tr>
    <td>Chocolate Cake</td>
    <td>Chocolate</td>
    <td>₹500</td>
</tr>
<tr>
    <td>Vanilla Cake</td>
    <td>Vanilla</td>
    <td>₹450</td>
</tr>
<tr>
    <td>Red Velvet</td>
    <td>Red Velvet</td>
    <td>₹700</td>
</tr>
</table>

<h2>Order Cake</h2>

<form>
    Name: <input type="text"><br><br>
    Cake: <select>
        <option>Chocolate Cake</option>
        <option>Vanilla Cake</option>
        <option>Red Velvet</option>
    </select><br><br>

    Quantity: <input type="number"><br><br>
    Address: <textarea></textarea><br><br>

    <input type="submit" value="Order Now">
</form>

</body>
</html>
