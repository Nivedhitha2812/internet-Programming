<!DOCTYPE html>
<html>
<head>
    <title>Online Toll Payment</title>
</head>
<body>

<h1 align="center">EasyToll</h1>

<h2>User Login</h2>

<form>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>
    <input type="submit" value="Login">
</form>

<h2>Toll Pass</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Pass Type</th>
    <th>Validity</th>
    <th>Amount</th>
</tr>
<tr>
    <td>Monthly Pass</td>
    <td>30 Days</td>
    <td>₹1500</td>
</tr>
<tr>
    <td>Yearly Pass</td>
    <td>365 Days</td>
    <td>₹15000</td>
</tr>
</table>

<h2>Apply Toll Pass</h2>

<form>
    Name: <input type="text"><br><br>
    Vehicle Number: <input type="text"><br><br>
    Pass Type:
    <select>
        <option>Monthly</option>
        <option>Yearly</option>
    </select><br><br>

    <input type="submit" value="Apply">
</form>

</body>
</html>
